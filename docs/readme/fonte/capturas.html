<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  #cartaz { height: 790px; padding: 10px; }
  .foto { position: absolute; width: 410px; }
  .foto .janela { border-radius: 14px; box-shadow: 0 6px 0 rgba(0,0,0,.85); }
  .foto .abas { padding: 7px 10px 0; }
  .foto .aba { font-size: 11.5px; padding: 5px 10px 6px; }
  .foto img { display: block; width: 100%; height: auto; border-top: 2px solid var(--tinta); }
  .legenda { font: italic 600 18px/1.2 var(--display); margin: 10px 0 0 6px; color: #000; background: #fff; display: inline-block; padding: 2px 10px; border-radius: 999px; border: 2px solid #000; }
  .fita { position: absolute; width: 96px; height: 26px; background: rgba(255, 255, 0, 0.72); top: -12px; left: 50%; margin-left: -48px; transform: rotate(-4deg); z-index: 3; border-left: 2px dotted rgba(0,0,0,.18); border-right: 2px dotted rgba(0,0,0,.18); }
  .f1 { left: 16px; top: 22px; transform: rotate(-2.5deg); }
  .f2 { left: 448px; top: 8px; transform: rotate(2deg); }
  .f3 { left: 30px; top: 410px; transform: rotate(1.6deg); }
  .f4 { left: 440px; top: 396px; transform: rotate(-2deg); }
  .f2 .fita { transform: rotate(5deg); }
  .f3 .fita { left: 20%; }
  .f4 .fita { left: 72%; transform: rotate(8deg); }
</style>
</head>
<body>
<div id="cartaz">
  <figure class="foto f1"><span class="fita"></span><div class="janela"><div class="abas"><div class="aba">¶ não feche esta aba</div></div><img src="capturas/abertura.png" alt=""></div><span class="legenda">o começo</span></figure>
  <figure class="foto f2"><span class="fita"></span><div class="janela"><div class="abas"><div class="aba">¶ § 3: O palheiro</div></div><img src="capturas/palheiro.png" alt=""></div><span class="legenda">§ 3, procure a agulha</span></figure>
  <figure class="foto f3"><span class="fita"></span><div class="janela"><div class="abas"><div class="aba">¶ § 11: O interruptor</div></div><img src="capturas/escuro.png" alt=""></div><span class="legenda">§ 11, de luz apagada</span></figure>
  <figure class="foto f4"><span class="fita"></span><div class="janela"><div class="abas"><div class="aba">¶ § 19: A parede</div></div><img src="capturas/avesso.png" alt=""></div><span class="legenda">§ 19, já no avesso</span></figure>
</div>
<script type="module">
  import { pronto } from "./pecas.js";
  document.querySelectorAll("figure").forEach((f) => { f.style.margin = "0"; });
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  pronto();
</script>
</body>
</html>
