<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  #cartaz { width: auto; display: inline-block; padding: 14px 18px 22px; }
  .botao {
    display: flex; align-items: center; gap: 14px;
    background: #0000ee; color: #fff;
    border: 2.5px solid #000;
    border-radius: 999px;
    padding: 12px 30px 12px 16px;
    box-shadow: 0 6px 0 #000;
    font: 800 23px/1 var(--texto);
    letter-spacing: -0.01em;
  }
  .botao .pe { --olho: #0000ee; --pupila: #fff; color: #fff; }
  .botao small { display: block; font: italic 500 15px/1.1 var(--display); color: #ffff00; margin-top: 4px; letter-spacing: 0; }
</style>
</head>
<body>
<div id="cartaz">
  <div class="botao"><span id="pe"></span><span>jogar no navegador<small>de graça, sem instalar nada</small></span></div>
</div>
<script type="module">
  import { pe, pronto } from "./pecas.js";
  document.getElementById("pe").append(pe({ largura: 30, humor: "feliz", chapeu: true }));
  pronto();
</script>
</body>
</html>
