<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  #cartaz { padding: 56px 24px 40px; }
  .folha { background: #0000ee; border: 2.5px solid #000; border-radius: 26px; padding: 30px 30px 34px; color: #fff; position: relative; }
  .cabeca { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 24px; }
  .cabeca h2 { font: 800 64px/0.85 var(--display); margin: 0; letter-spacing: -0.03em; }
  .cabeca p { margin: 0 0 4px; font: italic 500 21px/1.2 var(--display); color: #dfe3ff; }
  .grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .carta {
    border: 2px solid #fff; border-radius: 16px; padding: 12px 13px 13px;
    min-height: 124px; display: flex; flex-direction: column;
  }
  .carta:nth-child(4n+1) { transform: rotate(-0.6deg); }
  .carta:nth-child(4n+4) { transform: rotate(0.5deg); }
  .num { font: 400 32px/1 var(--display); }
  .nome { font: italic 600 16.5px/1.15 var(--display); margin: 3px 0 10px; }
  .tarja { margin-top: auto; height: 14px; background: #ffff00; border-radius: 3px; transform: skew(-8deg) rotate(-1deg); position: relative; }
  .tarja::after { content: "*"; position: absolute; right: -4px; top: -14px; font: 800 22px/1 var(--display); color: #ffff00; }
  .carta.chefe { background: #ffff00; color: #000; border-color: #000; }
  .carta.chefe .tarja { background: #000; }
  .carta.chefe .tarja::after { color: #000; }
  .dono { position: absolute; right: 30px; top: -34px; transform: rotate(10deg); }
  .balao-ast { position: absolute; right: 118px; top: -26px; background: #ffff00; color: #000; border: 2px solid #000; border-radius: 16px; padding: 7px 14px; font: italic 600 17px/1.1 var(--display); transform: rotate(-3deg); }
  .rodinha { position: absolute; left: 30px; bottom: -22px; font: italic 500 15px/1 var(--display); background: #fff; color: #0000ee; border: 2px solid #000; border-radius: 999px; padding: 7px 14px; }
</style>
</head>
<body>
<div id="cartaz">
  <div class="folha">
    <div class="cabeca">
      <h2>Ato II</h2>
      <p>o avesso. só abre para quem terminou o primeiro,<br>e o jeito de entrar também é segredo.</p>
    </div>
    <div class="grade" id="grade"></div>
    <div class="dono" id="ast"></div>
    <div class="balao-ast">*sem spoiler. vai jogar.</div>
    <div class="rodinha">*os controles estão tarjados de propósito</div>
  </div>
</div>
<script type="module">
  import { ast, pronto } from "./pecas.js";
  import { FASES, ATO2 } from "/site/js/fases/index.js";
  const grade = document.getElementById("grade");
  FASES.slice(ATO2).forEach((f, k) => {
    const i = ATO2 + k;
    const c = document.createElement("div");
    c.className = "carta" + (i === FASES.length - 1 ? " chefe" : "");
    c.innerHTML = `<span class="num">§ ${i + 1}</span><span class="nome">${f.nome}</span><span class="tarja" style="width:${45 + ((i * 37) % 45)}%"></span>`;
    grade.append(c);
  });
  document.getElementById("ast").append(ast({ largura: 84, girar: 20, olhar: [-0.8, 0.5] }));
  pronto();
</script>
</body>
</html>
