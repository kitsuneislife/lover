name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  jogar:
    name: Jogar os dois atos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Ato I
        run: npm run test:ato1
      - name: Ato II
        run: npm run test:ato2
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: tests/capturas
